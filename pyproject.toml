[project]
name = "mqtt-notif"
version = "0.1.0"
description = "MQTT to FCM notification bridge"
requires-python = ">=3.13"
dependencies = [
    "aiomqtt==2.5.1",
    "firebase-admin==7.7.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
mqtt-notif = "mqtt_notif.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mqtt_notif"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
